[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-caselaws"
version = "0.2.0"
description = "GST Case Law Research CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "beautifulsoup4>=4.10.0",
    "requests>=2.26.0",
    "pypdf>=3.0.0",
    "notebooklm-py>=0.5.0",
]

[project.scripts]
caselaws-cli = "cli_anything.caselaws.main:main"
